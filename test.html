<!DOCTYPE html>
<html>
  <body>
    <button onclick="send()">Send Test Data</button>

    <script>
      function send() {
        fetch("http://localhost:5000/api/client", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            name: "Test User",
            phone: "9800000000",
            message: "Hello from browser test",
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            console.log(data);
            alert("Data sent successfully!");
          })
          .catch((err) => console.error(err));
      }
    </script>
  </body>
</html>
