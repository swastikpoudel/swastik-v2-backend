<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Backend Test</title>
</head>
<body>

  <h2>Test Backend → MongoDB</h2>

  <button onclick="sendData()">Send Test Data</button>

  <pre id="result"></pre>

  <script>
    function sendData() {
      fetch("https://swastik-v2-backend.onrender.com/api/client", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: "HTML Test",
          phone: "9811111111",
          message: "Testing MongoDB save from HTML"
        })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("result").innerText =
          JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById("result").innerText = err.toString();
      });
    }
  </script>

</body>
</html>
